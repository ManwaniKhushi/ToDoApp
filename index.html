<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do Task App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
        <nav>
            <div class="logo"><h1>To Do App</h1></div>
        </nav>
        <div class="content">
            <h2>Add tasks instantly</h2>
            <p class="heading">JUST DO IT.</p>
            <button class="createbtn" id="showFormbtn">+ Add Task</button>
            <div class="createTask"><div class="form">
                <form action="" id="todoForm">
                    <input type="text" placeholder="Task Title" class="inputField" id="taskTitle" >
                    <p id="titleError"></p>
                    <textarea name="" id="taskDescription" placeholder="Type Description Here..." class="inputField"></textarea>
                    <button type="submit" class="createbtn">ADD</button>
                </form>
            </div></div>
            <div class="alltasks">
              <div class="outline">  
                <h3>All Records </h3>             
                <div class="list" id="taskList">   
                </div>
              </div>
            </div>
        </div>
    </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
